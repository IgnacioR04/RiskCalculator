# Configuración de la CLI de Supabase (cierre de D6).
#
# Hasta ahora el repositorio no tenía este archivo, así que el comportamiento
# local dependía de los valores por defecto de la versión de CLI instalada y
# `verify_jwt` de la Edge Function quedaba asumido en vez de declarado.
#
# Sirve para levantar Postgres en local y en CI y ejecutar las pruebas de RLS.
# No contiene secretos: las claves de servicio viven fuera del repositorio.

project_id = "riskcalculator"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

# La interfaz gráfica no aporta nada en CI y ahorra arrancar un contenedor.
[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# La Edge Function admite peticiones sin sesión, y es deliberado.
#
# Con `verify_jwt = true` la aplicación no podía cotizar ninguna acción, ETF ni
# metal en su modo local sin cuenta, que es el modo por defecto: una cartera
# real se quedaba con los precios que alguien escribió a mano semanas atrás y
# con todas las métricas históricas bloqueadas. Exigir registro para ver el
# precio de Microsoft contradice el principio de no pedir cuenta para lo
# esencial.
#
# Lo que sigue protegiendo la clave no es esta línea: es que vive en los
# secretos de la función, que solo se reenvían cuatro endpoints de una lista
# blanca, y que quien llama sin sesión tiene un cupo por IP más estrecho que el
# límite del propio plan de Twelve Data. Autorizado por el propietario el
# 2026-08-21.
[functions.market-proxy]
verify_jwt = false
