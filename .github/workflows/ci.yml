name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un grupo por workflow y ref. En un PR se cancela la ejecución anterior
# porque solo importa el último commit; en main no se cancela, para no perder
# la validación de un commit ya publicado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Check requerido en branch protection. Ver docs/runbooks/ci-required-checks.md
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # CI no escribe en el repositorio: no debe conservar el token.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # CI no escribe en el repositorio: no debe conservar el token.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Sin secretos: el build de CI valida el bundle, no publica nada. Las
      # variables VITE_* de Pages se inyectan solo en el workflow de despliegue.
      - name: Build de producción
        run: npm run build
        env:
          # El Laboratorio se despliega por capacidades. Se enciende aquí para
          # que `e2e-core` pueda ejercitarlo sobre este mismo bundle.
          VITE_LAB_FLAGS: labShell

      - name: Auditoría de secretos en el bundle
        run: |
          # Ninguna clave privada debe aparecer en el bundle. Las variables
          # VITE_* son públicas por diseño; TWELVE_DATA nunca debe filtrarse.
          if grep -ri "TWELVE_DATA_API_KEY" dist/assets/ 2>/dev/null; then
            echo "::error::Se encontró una referencia a la clave privada en el bundle"
            exit 1
          fi
          echo "OK: sin referencias a claves privadas en dist/"

      # El artefacto es el mismo build que valida E2E: se prueba lo que se
      # construye, no una compilación distinta hecha por el servidor de dev.
      - name: Publicar dist para el job de E2E
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 1

  # Check requerido en branch protection. Ver docs/runbooks/ci-required-checks.md
  e2e-core:
    name: e2e-core
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # CI no escribe en el repositorio: no debe conservar el token.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Recuperar el build validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Playwright sirve dist con `vite preview`. Sin variables de Supabase, de
      # modo que se ejercita el modo local/demo sin cuenta.
      - name: Pruebas end-to-end
        run: npm run test:e2e

      - name: Publicar traces y capturas solo si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
