name: Deploy a GitHub Pages

# El despliegue ya no se dispara por `push`: espera a que CI termine en verde
# sobre `main` y publica exactamente ese commit. Así un push que rompa las
# pruebas no puede llegar a producción adelantándose a la validación.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redespliegue manual de un commit bueno conocido. Ver
  # docs/runbooks/pages-deploy-failure.md
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo a redesplegar (debe haber pasado CI)
        required: true
        type: string

# Sin permisos por defecto: cada job declara solo lo que necesita.
permissions: {}

# Un solo despliegue en curso; no cancela el que ya esté publicando, para no
# dejar Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo se construye lo que CI validó sobre `main` en ESTE repositorio.
    #
    # El filtro `branches:` de `workflow_run` NO compara contra la rama de
    # destino: compara contra `head_branch`, la rama de origen de la ejecución
    # de CI. Como CI también corre en `pull_request`, un PR desde un fork cuya
    # rama se llamase `main` pasaría ese filtro. Sin las tres condiciones
    # siguientes se haría checkout de código no confiable, `npm ci` ejecutaría
    # sus scripts con los secretos en el entorno y el resultado se publicaría.
    # Por eso se exige además que el evento sea un push, que la rama sea `main`
    # y que el repositorio de origen sea este mismo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `actions/configure-pages` consulta la configuración de Pages. Lectura,
      # nunca escritura: publicar sigue siendo exclusivo del job `deploy`.
      pages: read
    steps:
      # `required: true` obliga a enviar el input, pero no impide enviarlo
      # vacío, y un `ref` vacío haría que checkout tomara la punta de `main`:
      # justo el commit sin validar que todo esto trata de evitar.
      - name: Validar el SHA del redespliegue manual
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA_SOLICITADO: ${{ inputs.sha }}
        run: |
          if ! printf '%s' "$SHA_SOLICITADO" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::El SHA debe ser un hash completo de 40 caracteres hexadecimales"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # El SHA exacto que pasó CI, no la punta de main: entre la validación
          # y el despliegue main puede haber avanzado con commits sin validar.
          # En una sola línea a propósito: plegar la expresión con `>-` conserva
          # los saltos de línea y GitHub recibiría el `ref` con retornos dentro.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
          # No dejar el token en .git/config del runner.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Este build no es el mismo artefacto que audita CI: Pages necesita el
      # subpath /RiskCalculator/ y las variables públicas de Supabase. Es el
      # mismo commit, reconstruido para su destino.
      - name: Build para Pages (subpath /RiskCalculator/)
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
