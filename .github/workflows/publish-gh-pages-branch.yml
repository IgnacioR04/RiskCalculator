# Publica el build en la rama `gh-pages`.
#
# Existe porque Settings → Pages está en «Deploy from a branch». En ese modo
# GitHub publica el árbol de la rama tal cual, y la raíz de `main` es código
# fuente: su `index.html` apunta a `/src/main.tsx`, que solo existe con el
# servidor de desarrollo. Servir la raíz da una página en blanco.
#
# Con este workflow, `gh-pages` contiene siempre el resultado de `vite build`,
# que sí es un sitio estático servible.
#
# Alternativa más limpia si algún día se quiere: poner Source en «GitHub
# Actions» y quedarse solo con deploy-pages.yml. Entonces este fichero y la
# rama gh-pages se pueden borrar.
name: Publicar build en la rama gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build para el subpath /RiskCalculator/
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Empujar dist a gh-pages
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
